<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LDOS Linux Policy Dataset Explorer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;--surface:#fff;--border:#e2dfd6;--border2:#d0cdc4;
  --text:#1a1a18;--muted:#888780;--accent:#4338ca;--accent-light:#eef2ff;
  --success:#16a34a;--danger:#dc2626;--danger-light:#fef2f2;
  --font:'Geist','Inter',system-ui,sans-serif;
  --mono:'Geist Mono','Fira Code',monospace;
  --r:8px;--rl:12px;
}
body{font-family:var(--font);font-size:13px;background:var(--bg);color:var(--text);min-height:100vh}

/* topbar */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.pill{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:500}
.pill-blue{background:var(--accent-light);color:var(--accent)}
.spacer{flex:1}

/* tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:2px}
.tab{padding:10px 16px;cursor:pointer;border:none;background:none;font-family:var(--font);font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:500}
.tab:hover:not(.active){color:var(--text)}
.panel{display:none}.panel.active{display:block}

.container{max-width:1160px;margin:0 auto;padding:24px}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.5rem}
.metric{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:14px 16px}
.mlabel{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.mval{font-size:26px;font-weight:600;letter-spacing:-.02em}

/* chart cards */
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem}
@media(max-width:680px){.chart-row{grid-template-columns:1fr}}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rl);padding:1rem}
.card-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.blabel{width:160px;text-align:right;color:var(--muted);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{flex:1;background:var(--bg);border-radius:3px;height:14px;overflow:hidden}
.bfill{height:100%;border-radius:3px}
.bcount{width:28px;text-align:right;color:var(--muted);flex-shrink:0;font-size:11px}

/* filters */
.filters{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rl);padding:1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:1rem}
.filters label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.filters select,.filters input{width:100%;font-size:12px;padding:6px 8px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);font-family:var(--font);color:var(--text)}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--accent)}

/* benefit dropdown */
.bd-wrap{position:relative}
.bd-btn{width:100%;font-size:12px;padding:6px 10px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);text-align:left;cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:space-between;gap:6px;transition:border-color .15s}
.bd-btn:hover,.bd-btn.open{border-color:#aaa}
.bd-arrow{font-size:10px;color:var(--muted);flex-shrink:0;transition:transform .2s;display:inline-block}
.bd-btn.open .bd-arrow{transform:rotate(180deg)}
.bd-menu{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.13),0 0 0 0.5px rgba(0,0,0,.08);z-index:60;overflow:hidden;min-width:220px}
.bd-menu.open{display:block}
.bd-top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:0.5px solid var(--border)}
.bd-search{flex:1;font-size:12px;padding:5px 10px;border:0.5px solid var(--border2);border-radius:6px;background:var(--bg);font-family:var(--font);color:var(--text)}
.bd-search:focus{outline:none;border-color:#aaa}
.bd-clear-top{font-size:11px;padding:4px 10px;border:0.5px solid var(--border2);border-radius:6px;background:var(--surface);cursor:pointer;color:var(--muted);font-family:var(--font);white-space:nowrap;flex-shrink:0}
.bd-clear-top:hover{background:var(--bg)}
.bd-list{max-height:220px;overflow-y:auto;padding:4px 0}
.bd-item{display:flex;align-items:flex-start;gap:10px;padding:7px 14px;cursor:pointer;font-size:12px;color:var(--muted);letter-spacing:.03em;transition:background .1s;line-height:1.5;word-break:break-word;user-select:none}
.bd-item:hover{background:var(--bg)}
.bd-item.checked{color:var(--text)}
.bd-cb{width:15px;height:15px;flex-shrink:0;border:1.5px solid #ccc;border-radius:3px;display:flex;align-items:center;justify-content:center;background:var(--surface);transition:all .15s;margin-top:1px}
.bd-item.checked .bd-cb{background:var(--accent);border-color:var(--accent)}
.bd-cb-tick{display:none;color:#fff;font-size:10px;font-weight:700;line-height:1}
.bd-item.checked .bd-cb-tick{display:block}

/* results bar */
.results-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.results-bar span{font-size:12px;color:var(--muted)}
.export-btn{font-size:12px;padding:5px 12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:5px}
.export-btn:hover{background:var(--bg)}

/* table */
.layout{display:flex;gap:0}
.table-col{flex:1;min-width:0}
.table-wrap{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rl);overflow:hidden}
.table-scroll{max-height:520px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
thead th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:0.5px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
tbody tr{border-bottom:0.5px solid #f1efe8;cursor:pointer}
tbody tr:hover{background:#fafaf8}
tbody tr.sel{background:var(--accent-light)}
tbody td{padding:7px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.empty{text-align:center;padding:2.5rem;color:var(--muted)}

/* badges */
.cb{display:inline-block;padding:2px 7px;border-radius:9px;font-size:11px;white-space:nowrap}
.cb-memory{background:#d1fae5;color:#065f46}
.cb-cpu_scheduling{background:#dbeafe;color:#1e40af}
.cb-io_scheduling{background:#fef3c7;color:#92400e}
.cb-power_management{background:#fce7f3;color:#9d174d}
.cb-filesystem{background:#ede9fe;color:#4c1d95}

/* detail panel */
.detail-col{width:370px;flex-shrink:0;border-left:0.5px solid var(--border);background:var(--surface);position:sticky;top:0;height:calc(100vh - 120px);overflow-y:auto;display:none}
.detail-col.open{display:block}
.dh{padding:14px 16px;border-bottom:0.5px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;display:flex;align-items:center;gap:8px}
.dh h2{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dclose{cursor:pointer;background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:0 2px}
.dclose:hover{color:var(--text)}
.dbody{padding:14px 16px}
.dsec{margin-bottom:18px}
.dsec-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;padding-bottom:5px;border-bottom:0.5px solid var(--border)}
.frow{display:grid;grid-template-columns:110px 1fr;gap:6px;padding:5px 0;font-size:12px;border-bottom:0.5px solid #f5f4f0}
.frow:last-child{border-bottom:none}
.fl{color:var(--muted);font-weight:500;padding-top:2px}
.fv{color:var(--text);word-break:break-word;line-height:1.5}
.fv code{font-family:var(--mono);font-size:11px;background:var(--bg);padding:1px 5px;border-radius:3px}
.feat-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.feat{padding:2px 9px;border-radius:8px;font-size:11px}
.feat.on{background:#dcfce7;color:#15803d}
.feat.off{background:var(--bg);color:#d1d5db}
.code-block{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);padding:9px 10px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:150px;overflow-y:auto;margin-top:2px;line-height:1.6}
</style>
</head>
<body>
<div class="topbar">
  <i class="ti ti-database" style="font-size:20px;color:#4338ca" aria-hidden="true"></i>
  <h1>Linux Policy Dataset</h1>
  <div class="spacer"></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('overview')"><i class="ti ti-chart-bar"></i> Overview</button>
  <button class="tab" onclick="showTab('query')"><i class="ti ti-search"></i> Query</button>
</div>

<div class="container">

  <!-- OVERVIEW -->
  <div id="tab-overview" class="panel active">
    <div class="metrics" id="metrics"></div>
    <div class="chart-row">
      <div class="card"><div class="card-title">By subsystem</div><div id="c-sub"></div></div>
      <div class="card"><div class="card-title">By category</div><div id="c-cat"></div></div>
    </div>
    <div class="chart-row">
      <div class="card"><div class="card-title">By implementation</div><div id="c-impl"></div></div>
      <div class="card"><div class="card-title">Filesystem areas</div><div id="c-area"></div></div>
    </div>
  </div>

  <!-- QUERY -->
  <div id="tab-query" class="panel">
    <div class="filters">
      <div>
        <label>Search</label>
        <input type="text" id="f-search" placeholder="file, function, benefit…" oninput="applyFilters()">
      </div>
      <div>
        <label>Subsystem</label>
        <select id="f-sub" onchange="applyFilters()"><option value="">All</option></select>
      </div>
      <div>
        <label>Category</label>
        <select id="f-cat" onchange="applyFilters()"><option value="">All</option></select>
      </div>
      <div>
        <label>Implementation</label>
        <select id="f-impl" onchange="applyFilters()"><option value="">All</option></select>
      </div>
      <div>
        <label>Mod layer</label>
        <select id="f-mod" onchange="applyFilters()"><option value="">All</option></select>
      </div>
      <div>
        <label>Value Type</label>
        <select id="f-vtype" onchange="applyFilters()"><option value="">All</option></select>
      </div>
      <div>
        <label>Feature</label>
        <select id="f-feat" onchange="applyFilters()">
          <option value="">All</option>
          <option value="feat_global_state">Global state</option>
          <option value="feat_history">History</option>
          <option value="feat_hardware">Hardware</option>
          <option value="feat_local_object">Local object</option>
          <option value="feat_config">Config</option>
        </select>
      </div>
      <div class="bd-wrap" id="benefit-wrap">
        <label>Benefit</label>
        <button class="bd-btn" id="benefit-btn" onclick="toggleBenefitMenu()">
          <span id="benefit-label">All benefits</span>
          <span class="bd-arrow">▼</span>
        </button>
        <div class="bd-menu" id="benefit-menu">
          <div class="bd-top">
            <input class="bd-search" id="benefit-search" type="text" placeholder="Search…" oninput="filterBenefitMenu()">
            <button class="bd-clear-top" onclick="clearBenefits()">Clear</button>
          </div>
          <div class="bd-list" id="benefit-options"></div>
        </div>
      </div>
    </div>

    <div class="layout">
      <div class="table-col">
        <div class="results-bar">
          <span id="result-count">334 policies</span>
          <button class="export-btn" onclick="exportCSV()"><i class="ti ti-download"></i> Export CSV</button>
        </div>
        <div class="table-wrap">
          <div class="table-scroll">
            <table>
              <thead><tr>
                <th style="width:110px">File / Area</th>
                <th style="width:150px">Symbol / Knob</th>
                <th style="width:95px">Subsystem</th>
                <th style="width:115px">Category</th>
                <th style="width:130px">Implementation</th>
                <th style="width:140px">Benefit</th>
                <th>Cost</th>
              </tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="detail-col" id="detail-col">
        <div class="dh">
          <h2 id="dtitle">—</h2>
          <button class="dclose" onclick="closeDetail()">×</button>
        </div>
        <div class="dbody" id="dbody"></div>
      </div>
    </div>
  </div>

</div>

         * Try to make the obvious choice first. When anon and file are both\n         * available from the same generation, interpret swappiness 1 as file\n         * first and 200 as anon first.\n         */\n        if (!swappiness)\n                type = LRU_GEN_FILE;\n        else if (min_seq[LRU_GEN_ANON] < min_seq[LRU_GEN_FILE])\n                type = LRU_GEN_ANON;\n        else if (swappiness == 1)\n                type = LRU_GEN_FILE;\n        else if (swappiness == 200)\n                type = LRU_GEN_ANON;\n        else\n                type = get_type_to_scan(lruvec, swappiness, &tier);\n\n        for (i = !swappiness; i < ANON_AND_FILE; i++) {\n                if (tier < 0)\n                        tier = get_tier_idx(lruvec, type);\n\n                scanned = scan_folios(lruvec, sc, type, tier, list);\n                if (scanned)\n                        break;\n\n                type = !type;\n                tier = -1;\n        }\n\n        *type_scanned = type;\n\n        return scanned;\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::vmscan.c::shrink_active_list","subsystem":"memory","file":"vmscan.c","symbol":"shrink_active_list","policy_category":"Selection","value_type":"Object","how_coded":null,"impl_taxonomy":"Inline_Code","benefit":null,"cost":null,"tradeoff_subcategory":null,"feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::vmscan.c::shrink_inactive_list","subsystem":"memory","file":"vmscan.c","symbol":"shrink_inactive_list","policy_category":"Selection","value_type":"Object","how_coded":null,"impl_taxonomy":"Inline_Code","benefit":null,"cost":null,"tradeoff_subcategory":null,"feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::vmscan.c::should_run_aging","subsystem":"memory","file":"vmscan.c","symbol":"should_run_aging","policy_category":"Action","value_type":"Attribute","how_coded":"Decision_Function","impl_taxonomy":"Decision_Function","benefit":"Resource Efficiency","cost":"CPU Overhead","tradeoff_subcategory":"Space/Locality vs. I/O or CPU overhead","feat_global_state":1,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"static bool should_run_aging(struct lruvec *lruvec, unsigned long max_seq,\n                             struct scan_control *sc, bool can_swap, unsigned long *nr_to_scan)\n{\n        int gen, type, zone;\n        unsigned long old = 0;\n        unsigned long young = 0;\n        unsigned long total = 0;\n        struct lru_gen_folio *lrugen = &lruvec->lrugen;\n        struct mem_cgroup *memcg = lruvec_memcg(lruvec);\n        DEFINE_MIN_SEQ(lruvec);\n\n        /* whether this lruvec is completely out of cold folios */\n        if (min_seq[!can_swap] + MIN_NR_GENS > max_seq) {\n                *nr_to_scan = 0;\n                return true;\n        }\n\n        for (type = !can_swap; type < ANON_AND_FILE; type++) {\n                unsigned long seq;\n\n                for (seq = min_seq[type]; seq <= max_seq; seq++) {\n                        unsigned long size = 0;\n\n                        gen = lru_gen_from_seq(seq);\n\n                        for (zone = 0; zone < MAX_NR_ZONES; zone++)\n                                size += max(READ_ONCE(lrugen->nr_pages[gen][type][zone]), 0L);\n\n                        total += size;\n                        if (seq == max_seq)\n                                young += size;\n                        else if (seq + MIN_NR_GENS == max_seq)\n                                old += size;\n                }\n        }\n\n        /* try to scrape all its memory if this memcg was deleted */\n        if (!mem_cgroup_online(memcg)) {\n                *nr_to_scan = total;\n                return false;\n        }\n\n        *nr_to_scan = total >> sc->priority;\n\n        /*\n         * The aging tries to be lazy to reduce the overhead, while the eviction\n         * stalls when the number of generations reaches MIN_NR_GENS. Hence, the\n         * ideal number of generations is MIN_NR_GENS+1.\n         */\n        if (min_seq[!can_swap] + MIN_NR_GENS < max_seq)\n                return false;\n\n        /*\n         * It's also ideal to spread pages out evenly, i.e., 1/(MIN_NR_GENS+1)\n         * of the total number of pages for each generation. A reasonable range\n         * for this average portion is [1/MIN_NR_GENS, 1/(MIN_NR_GENS+2)]. The\n         * aging cares about the upper bound of hot pages, while the eviction\n         * cares about the lower bound of cold pages.\n         */\n        if (young * MIN_NR_GENS > total)\n                return true;\n        if (old * (MIN_NR_GENS + 2) < total)\n                return true;\n\n        return false;\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::vmscan.c::SWAP_CLUSTER_MAX","subsystem":"memory","file":"vmscan.c","symbol":"SWAP_CLUSTER_MAX","policy_category":null,"value_type":"Threshold","how_coded":null,"impl_taxonomy":"Constants","benefit":"Latency","cost":"CPU Overhead","tradeoff_subcategory":null,"feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::vmscan.c::should_continue_reclaim","subsystem":"memory","file":"vmscan.c","symbol":"should_continue_reclaim","policy_category":"Action","value_type":"Attribute","how_coded":"Decision_Function","impl_taxonomy":"Decision_Function","benefit":"Latency","cost":"Success/Effort","tradeoff_subcategory":"Space/Locality vs. I/O or CPU overhead","feat_global_state":1,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"/*\n * Reclaim/compaction is used for high-order allocation requests. It reclaims\n * order-0 pages before compacting the zone. should_continue_reclaim() returns\n * true if more pages should be reclaimed such that when the page allocator\n * calls try_to_compact_pages() that it will have enough free pages to succeed.\n * It will give up earlier than that if there is difficulty reclaiming pages.\n */\nstatic inline bool should_continue_reclaim(struct pglist_data *pgdat,\n                                        unsigned long nr_reclaimed,\n                                        struct scan_control *sc)\n{\n        unsigned long pages_for_compaction;\n        unsigned long inactive_lru_pages;\n        int z;\n\n        /* If not in reclaim/compaction mode, stop */\n        if (!in_reclaim_compaction(sc))\n                return false;\n\n        /*\n         * Stop if we failed to reclaim any pages from the last SWAP_CLUSTER_MAX\n         * number of pages that were scanned. This will return to the caller\n         * with the risk reclaim/compaction and the resulting allocation attempt\n         * fails. In the past we have tried harder for __GFP_RETRY_MAYFAIL\n         * allocations through requiring that the full LRU list has been scanned\n         * first, by assuming that zero delta of sc->nr_scanned means full LRU\n         * scan, but that approximation was wrong, and there were corner cases\n         * where always a non-zero amount of pages were scanned.\n         */\n        if (!nr_reclaimed)\n                return false;\n\n        /* If compaction would go ahead or the allocation would succeed, stop */\n        for (z = 0; z <= sc->reclaim_idx; z++) {\n                struct zone *zone = &pgdat->node_zones[z];\n                if (!managed_zone(zone))\n                        continue;\n\n                /* Allocation can already succeed, nothing to do */\n                if (zone_watermark_ok(zone, sc->order, min_wmark_pages(zone),\n                                      sc->reclaim_idx, 0))\n                        return false;\n\n                if (compaction_suitable(zone, sc->order, sc->reclaim_idx))\n                        return false;\n        }\n\n        /*\n         * If we have not reclaimed enough pages for compaction and the\n         * inactive lists are large enough, continue reclaiming\n         */\n        pages_for_compaction = compact_gap(sc->order);\n        inactive_lru_pages = node_page_state(pgdat, NR_INACTIVE_FILE);\n        if (can_reclaim_anon_pages(NULL, pgdat->node_id, sc))\n                inactive_lru_pages += node_page_state(pgdat, NR_INACTIVE_ANON);\n\n        return inactive_lru_pages > pages_for_compaction;\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::vmscan.c::consider_reclaim_throttle","subsystem":"memory","file":"vmscan.c","symbol":"consider_reclaim_throttle","policy_category":"Action","value_type":"Attribute","how_coded":"Inline_With_Mechanism","impl_taxonomy":"Inline_Code","benefit":"Resource Efficiency","cost":"Latency","tradeoff_subcategory":"Space/Locality vs. CPU overhead","feat_global_state":0,"feat_history":1,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"static void consider_reclaim_throttle(pg_data_t *pgdat, struct scan_control *sc)\n{\n        /*\n         * If reclaim is making progress greater than 12% efficiency then\n         * wake all the NOPROGRESS throttled tasks.\n         */\n        if (sc->nr_reclaimed > (sc->nr_scanned >> 3)) {\n                wait_queue_head_t *wqh;\n\n                wqh = &pgdat->reclaim_wait[VMSCAN_THROTTLE_NOPROGRESS];\n                if (waitqueue_active(wqh))\n                        wake_up(wqh);\n\n                return;\n        }\n\n        /*\n         * Do not throttle kswapd or cgroup reclaim on NOPROGRESS as it will\n         * throttle on VMSCAN_THROTTLE_WRITEBACK if there are too many pages\n         * under writeback and marked for immediate reclaim at the tail of the\n         * LRU.\n         */\n        if (current_is_kswapd() || cgroup_reclaim(sc))\n                return;\n\n        /* Throttle if making no progress at high prioities. */\n        if (sc->priority == 1 && !sc->nr_reclaimed)\n                reclaim_throttle(pgdat, VMSCAN_THROTTLE_NOPROGRESS);\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::vm.dirty_background_bytes","subsystem":"memory","file":"page-writeback.c","symbol":"vm.dirty_background_bytes","policy_category":"Threshold","value_type":"Threshold","how_coded":"External_Parameter","impl_taxonomy":"Configurations","benefit":"Latency","cost":"integrity","tradeoff_subcategory":"Memory Efficiency vs. Performance","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"/*\n * dirty_background_bytes starts at 0 (disabled) so that it is a function of\n * dirty_background_ratio * the amount of dirtyable memory\n */","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::vm.dirty_background_ratio","subsystem":"memory","file":"page-writeback.c","symbol":"vm.dirty_background_ratio","policy_category":"Threshold","value_type":"Threshold","how_coded":"External_Parameter","impl_taxonomy":"Configurations","benefit":"Latency","cost":"integrity","tradeoff_subcategory":"Memory Efficiency vs. Performance","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"/*\n * Start background writeback (via writeback threads) at this percentage\n */\nstatic int dirty_background_ratio = 10;","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::vm.dirty_bytes","subsystem":"memory","file":"page-writeback.c","symbol":"vm.dirty_bytes","policy_category":"Threshold","value_type":"Threshold","how_coded":"External_Parameter","impl_taxonomy":"Configurations","benefit":"Latency","cost":"integrity","tradeoff_subcategory":"Memory Efficiency vs. Performance","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"/*\n * vm_dirty_bytes starts at 0 (disabled) so that it is a function of\n * vm_dirty_ratio * the amount of dirtyable memory\n */\nstatic unsigned long vm_dirty_bytes;","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::vm.dirty_ratio","subsystem":"memory","file":"page-writeback.c","symbol":"vm.dirty_ratio","policy_category":"Threshold","value_type":"Threshold","how_coded":"External_Parameter","impl_taxonomy":"Configurations","benefit":"Latency","cost":"integrity","tradeoff_subcategory":"Memory Efficiency vs. Performance","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"/*\n * The generator of dirty data starts writeback at this percentage\n */","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::vm.dirty_writeback_centisecs","subsystem":"memory","file":"page-writeback.c","symbol":"vm.dirty_writeback_centisecs","policy_category":"Period","value_type":"Time","how_coded":"External_Parameter","impl_taxonomy":"Configurations","benefit":"CPU Overhead","cost":"Resource Efficiency","tradeoff_subcategory":"Space/Locality vs. CPU overhead","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"/*\n * sysctl handler for /proc/sys/vm/dirty_writeback_centisecs\n */\nstatic int dirty_writeback_centisecs_handler(struct ctl_table *table, int write,\n                void *buffer, size_t *length, loff_t *ppos)\n{\n        unsigned int old_interval = dirty_writeback_interval;\n        int ret;\n\n        ret = proc_dointvec(table, write, buffer, length, ppos);\n\n        /*\n         * Writing 0 to dirty_writeback_interval will _subcategory":null,"feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::wb_over_bg_thresh","subsystem":"memory","file":"page-writeback.c","symbol":"wb_over_bg_thresh","policy_category":"Action","value_type":"Attribute","how_coded":"Decision_Function","impl_taxonomy":"Decision_Function","benefit":"Resource Efficiency","cost":"CPU Overhead","tradeoff_subcategory":"Space/Locality vs. I/O or CPU overhead","feat_global_state":1,"feat_history":0,"feat_hardware":0,"feat_local_object":1,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::dirty_poll_interval","subsystem":"memory","file":"page-writeback.c","symbol":"dirty_poll_interval","policy_category":"Calculate_a_Value","value_type":"Time","how_coded":"Decision_Function","impl_taxonomy":"Decision_Function","benefit":"CPU Overhead","cost":"Latency","tradeoff_subcategory":"Space/Locality vs. CPU overhead","feat_global_state":1,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::domain_dirty_limits","subsystem":"memory","file":"page-writeback.c","symbol":"domain_dirty_limits","policy_category":"Calculate_a_Value","value_type":"Threshold","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":"Fairness","cost":"Lower Utilization; CPU Overhead","tradeoff_subcategory":"Performance vs. Memory use","feat_global_state":1,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"\"void decide_domain_dirty_limits(struct dirty_throttle_control *dtc, struct task_struct *tsk) {\n    unsigned long ratio = (vm_dirty_ratio * PAGE_SIZE) / 100;\n    unsigned long bg_ratio = (dirty_background_ratio * PAGE_SIZE) / 100;\n    unsigned long thresh;\n    unsigned long bg_thresh;\n\n    if (vm_dirty_bytes)\n        ratio = min(DIV_ROUND_UP(vm_dirty_bytes, dtc->avail), PAGE_SIZE);\n    if (dirty_background_bytes)\n        bg_ratio = min(DIV_ROUND_UP(dirty_background_bytes, dtc->avail), PAGE_SIZE);\n\n    thresh = (ratio * dtc->avail) / PAGE_SIZE;\n    bg_thresh = (bg_ratio * dtc->avail) / PAGE_SIZE;\n\n    if (rt_task(tsk)) {\n        bg_thresh += bg_thresh / 4 + global_wb_domain.dirty_limit / 32;\n        thresh += thresh / 4 + global_wb_domain.dirty_limit / 32;\n    }\n\n    dtc->thresh = thresh;\n    dtc->bg_thresh = bg_thresh;\n}\"","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::wb_dirty_limits","subsystem":"memory","file":"page-writeback.c","symbol":"wb_dirty_limits","policy_category":"Calculate_a_Value","value_type":"Threshold","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":"Fairness","cost":"Lower Utilization; CPU Overhead","tradeoff_subcategory":"Performance vs. Memory use","feat_global_state":1,"feat_history":0,"feat_hardware":0,"feat_local_object":1,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::wb_max_pause","subsystem":"memory","file":"page-writeback.c","symbol":"wb_max_pause","policy_category":"Calculate_a_Value","value_type":"Time","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":"CPU Overhead","cost":"Latency","tradeoff_subcategory":"Performance vs. I/O or CPU overhead","feat_global_state":0,"feat_history":1,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"static unsigned long wb_max_pause(struct bdi_writeback *wb,\n                                  unsigned long wb_dirty)\n{\n        unsigned long bw = READ_ONCE(wb->avg_write_bandwidth);\n        unsigned long t;\n\n        /*\n         * Limit pause time for small memory systems. If sleeping for too long\n         * time, a small pool of dirty/writeback pages may go empty and disk go\n         * idle.\n         *\n         * 8 serves as the safety ratio.\n         */\n        t = wb_dirty / (1 + bw / roundup_pow_of_two(1 + HZ / 8));\n        t++;\n\n        return min_t(unsigned long, t, MAX_PAUSE);\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::wb_min_pause","subsystem":"memory","file":"page-writeback.c","symbol":"wb_min_pause","policy_category":"Calculate_a_Value","value_type":"Time","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":"CPU Overhead","cost":"Latency","tradeoff_subcategory":"Performance vs. I/O or CPU overhead","feat_global_state":1,"feat_history":1,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"static long wb_min_pause(struct bdi_writeback *wb,\n                         long max_pause,\n                         unsigned long task_ratelimit,\n                         unsigned long dirty_ratelimit,\n                         int *nr_dirtied_pause)\n{\n        long hi = ilog2(READ_ONCE(wb->avg_write_bandwidth));\n        long lo = ilog2(READ_ONCE(wb->dirty_ratelimit));\n        long t;                /* target pause */\n        long pause;        /* estimated next pause */\n        int pages;        /* target nr_dirtied_pause */\n\n        /* target for 10ms pause on 1-dd case */\n        t = max(1, HZ / 100);\n\n        /*\n         * Scale up pause time for concurrent dirtiers in order to reduce CPU\n         * overheads.\n         *\n         * (N * 10ms) on 2^N concurrent tasks.\n         */\n        if (hi > lo)\n                t += (hi - lo) * (10 * HZ) / 1024;\n\n        /*\n         * This is a bit convoluted. We try to base the next nr_dirtied_pause\n         * on the much more stable dirty_ratelimit. However the next pause time\n         * will be computed based on task_ratelimit and the two rate limits may\n         * depart considerably at some time. Especially if task_ratelimit goes\n         * below dirty_ratelimit/2 and the target pause is max_pause, the next\n         * pause time will be max_pause*2 _trimmed down_ to max_pause.  As a\n         * result task_ratelimit won't be executed faithfully, which could\n         * eventually bring down dirty_ratelimit.\n         *\n         * We apply two rules to fix it up:\n         * 1) try to estimate the next pause time and if necessary, use a lower\n         *    nr_dirtied_pause so as not to exceed max_pause. When this happens,\n         *    nr_dirtied_pause will be \"dancing\" with task_ratelimit.\n         * 2) limit the target pause time to max_pause/2, so that the normal\n         *    small fluctuations of task_ratelimit won't trigger rule (1) and\n         *    nr_dirtied_pause will remain as stable as dirty_ratelimit.\n         */\n        t = min(t, 1 + max_pause / 2);\n        pages = dirty_ratelimit * t / roundup_pow_of_two(HZ);\n\n        /*\n         * Tiny nr_dirtied_pause is found to hurt I/O performance in the test\n         * case fio-mmap-randwrite-64k, which does 16*{sync read, async write}.\n         * When the 16 consecutive reads are often interrupted by some dirty\n         * throttling pause during the async writes, cfq will go into idles\n         * (deadline is fine). So push nr_dirtied_pause as high as possible\n         * until reaches DIRTY_POLL_THRESH=32 pages.\n         */\n        if (pages < DIRTY_POLL_THRESH) {\n                t = max_pause;\n                pages = dirty_ratelimit * t / roundup_pow_of_two(HZ);\n                if (pages > DIRTY_POLL_THRESH) {\n                        pages = DIRTY_POLL_THRESH;\n                        t = HZ * DIRTY_POLL_THRESH / dirty_ratelimit;\n                }\n        }\n\n        pause = HZ * pages / (task_ratelimit + 1);\n        if (pause > max_pause) {\n                t = max_pause;\n                pages = task_ratelimit * t / roundup_pow_of_two(HZ);\n        }\n\n        *nr_dirtied_pause = pages;\n        /*\n         * The minimal pause time will normally be half the target pause time.\n         */\n        return pages >= DIRTY_POLL_THRESH ? 1 + t / 2 : t;\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::wb_position_ratio","subsystem":"memory","file":"page-writeback.c","symbol":"wb_position_ratio","policy_category":"Calculate_a_Value","value_type":"Metric","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":"Stability","cost":null,"tradeoff_subcategory":"Performance vs. I/O or CPU overhead; Performance vs. Memory use","feat_global_state":1,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"static void wb_position_ratio(struct dirty_throttle_control *dtc)\n{\n        struct bdi_writeback *wb = dtc->wb;\n        unsigned long write_bw = READ_ONCE(wb->avg_write_bandwidth);\n        unsigned long freerun = dirty_freerun_ceiling(dtc->thresh, dtc->bg_thresh);\n        unsigned long limit = hard_dirty_limit(dtc_dom(dtc), dtc->thresh);\n        unsigned long wb_thresh = dtc->wb_thresh;\n        unsigned long x_intercept;\n        unsigned long setpoint;                /* dirty pages' target balance point */\n        unsigned long wb_setpoint;\n        unsigned long span;\n        long long pos_ratio;                /* for scaling up/down the rate limit */\n        long x;\n\n        dtc->pos_ratio = 0;\n\n        if (unlikely(dtc->dirty >= limit))\n                return;\n\n        /*\n         * global setpoint\n         *\n         * See comment for pos_ratio_polynom().\n         */\n        setpoint = (freerun + limit) / 2;\n        pos_ratio = pos_ratio_polynom(setpoint, dtc->dirty, limit);\n\n        /*\n         * The strictlimit feature is a tool preventing mistrusted filesystems\n         * from growing a large number of dirty pages before throttling. For\n         * such filesystems balance_dirty_pages always checks wb counters\n         * against wb limits. Even if global \"nr_dirty\" is under \"freerun\".\n         * This is especially important for fuse which sets bdi->max_ratio to\n         * 1% by default. Without strictlimit feature, fuse writeback may\n         * consume arbitrary amount of RAM because it is accounted in\n         * NR_WRITEBACK_TEMP which is not involved in calculating \"nr_dirty\".\n         *\n         * Here, in wb_position_ratio(), we calculate pos_ratio based on\n         * two values: wb_dirty and wb_thresh. Let's consider an example:\n         * total amount of RAM is 16GB, bdi->max_ratio is equal to 1%, global\n         * limits are set by default to 10% and 20% (background and throttle).\n         * Then wb_thresh is 1% of 20% of 16GB. This amounts to ~8K pages.\n         * wb_calc_thresh(wb, bg_thresh) is about ~4K pages. wb_setpoint is\n         * about ~6K pages (as the average of background and throttle wb\n         * limits). The 3rd order polynomial will provide positive feedback if\n         * wb_dirty is under wb_setpoint and vice versa.\n         *\n         * Note, that we cannot use global counters in these calculations\n         * because we want to throttle process writing to a strictlimit wb\n         * much earlier than global \"freerun\" is reached (~23MB vs. ~2.3GB\n         * in the example above).\n         */\n        if (unlikely(wb->bdi->capabilities & BDI_CAP_STRICTLIMIT)) {\n                long long wb_pos_ratio;\n\n                if (dtc->wb_dirty < 8) {\n                        dtc->pos_ratio = min_t(long long, pos_ratio * 2,\n                                           2 << RATELIMIT_CALC_SHIFT);\n                        return;\n                }\n\n                if (dtc->wb_dirty >= wb_thresh)\n                        return;\n\n                wb_setpoint = dirty_freerun_ceiling(wb_thresh,\n                                                    dtc->wb_bg_thresh);\n\n                if (wb_setpoint == 0 || wb_setpoint == wb_thresh)\n                        return;\n\n                wb_pos_ratio = pos_ratio_polynom(wb_setpoint, dtc->wb_dirty,\n                                                 wb_thresh);\n\n                /*\n                 * Typically, for strictlimit case, wb_setpoint << setpoint\n                 * and pos_ratio >> wb_pos_ratio. In the other words global\n                 * state (\"dirty\") is not limiting factor and we have to\n                 * make decision based on wb counters. But there is an\n                 * important case when global pos_ratio should get precedence:\n                 * global limits are exceeded (e.g. due to activities on other\n                 * wb's) while given strictlimit wb is below limit.\n                 *\n                 * \"pos_ratio * wb_pos_ratio\" would work for the case above,\n                 * but it would look too non-natural for the case of all\n                 * activity in the system coming from a single strictlimit wb\n                 * with bdi->max_ratio == 100%.\n                 *\n                 * Note that min() below somewhat changes the dynamics of the\n                 * control system. Normally, pos_ratio value can be well over 3\n                 * (when globally we are at freerun and wb is well below wb\n                 * setpoint). Now the maximum pos_ratio in the same situation\n                 * is 2. We might want to tweak this if we observe the control\n                 * system is too slow to adapt.\n                 */\n                dtc->pos_ratio = min(pos_ratio, wb_pos_ratio);\n                return;\n        }\n\n        /*\n         * We have computed basic pos_ratio above based on global situation. If\n         * the wb is over/under its share of dirty pages, we want to scale\n         * pos_ratio further down/up. That is done by the following mechanism.\n         */\n\n        /*\n         * wb setpoint\n         *\n         *        f(wb_dirty) := 1.0 + k * (wb_dirty - wb_setpoint)\n         *\n         *                        x_intercept - wb_dirty\n         *                     := --------------------------\n         *                        x_intercept - wb_setpoint\n         *\n         * The main wb control line is a linear function that subjects to\n         *\n         * (1) f(wb_setpoint) = 1.0\n         * (2) k = - 1 / (8 * write_bw)  (in single wb case)\n         *     or equally: x_intercept = wb_setpoint + 8 * write_bw\n         *\n         * For single wb case, the dirty pages are observed to fluctuate\n         * regularly within range\n         *        [wb_setpoint - write_bw/2, wb_setpoint + write_bw/2]\n         * for various filesystems, where (2) can yield in a reasonable 12.5%\n         * fluctuation range for pos_ratio.\n         *\n         * For JBOD case, wb_thresh (not wb_dirty!) could fluctuate up to its\n         * own size, so move the slope over accordingly and choose a slope that\n         * yields 100% pos_ratio fluctuation on suddenly doubled wb_thresh.\n         */\n        if (unlikely(wb_thresh > dtc->thresh))\n                wb_thresh = dtc->thresh;\n        /*\n         * It's very possible that wb_thresh is close to 0 not because the\n         * device is slow, but that it has remained inactive for long time.\n         * Honour such devices a reasonable good (hopefully IO efficient)\n         * threshold, so that the occasional writes won't be blocked and active\n         * writes can rampup the threshold quickly.\n         */\n        wb_thresh = max(wb_thresh, (limit - dtc->dirty) / 8);\n        /*\n         * scale global setpoint to wb's:\n         *        wb_setpoint = setpoint * wb_thresh / thresh\n         */\n        x = div_u64((u64)wb_thresh << 16, dtc->thresh | 1);\n        wb_setpoint = setpoint * (u64)x >> 16;\n        /*\n         * Use span=(8*write_bw) in single wb case as indicated by\n         * (thresh - wb_thresh ~= 0) and transit to wb_thresh in JBOD case.\n         *\n         *        wb_thresh                    thresh - wb_thresh\n         * span = --------- * (8 * write_bw) + ------------------ * wb_thresh\n         *         thresh                           thresh\n         */\n        span = (dtc->thresh - wb_thresh + 8 * write_bw) * (u64)x >> 16;\n        x_intercept = wb_setpoint + span;\n\n        if (dtc->wb_dirty < x_intercept - span / 4) {\n                pos_ratio = div64_u64(pos_ratio * (x_intercept - dtc->wb_dirty),\n                                      (x_intercept - wb_setpoint) | 1);\n        } else\n                pos_ratio /= 4;\n\n        /*\n         * wb reserve area, safeguard against dirty pool underrun and disk idle\n         * It may push the desired control point of global dirty pages higher\n         * than setpoint.\n         */\n        x_intercept = wb_thresh / 2;\n        if (dtc->wb_dirty < x_intercept) {\n                if (dtc->wb_dirty > x_intercept / 8)\n                        pos_ratio = div_u64(pos_ratio * x_intercept,\n                                            dtc->wb_dirty);\n                else\n                        pos_ratio *= 8;\n        }\n\n        dtc->pos_ratio = pos_ratio;\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::__wb_calc_thresh","subsystem":"memory","file":"page-writeback.c","symbol":"__wb_calc_thresh","policy_category":"Calculate_a_Value","value_type":"Threshold","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":"Fairness","cost":"Lower Utilization; CPU Overhead","tradeoff_subcategory":"Performance vs. I/O or CPU overhead;  Performance vs. Memory use","feat_global_state":0,"feat_history":0,"feat_hardware":1,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::wb_update_write_bandwidth","subsystem":"memory","file":"page-writeback.c","symbol":"wb_update_write_bandwidth","policy_category":"Calculate_a_Value","value_type":"Time","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":"Stability","cost":null,"tradeoff_subcategory":"Space/Locality vs. I/O or CPU overhead","feat_global_state":0,"feat_history":1,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::wb_update_dirty_ratelimit","subsystem":"memory","file":"page-writeback.c","symbol":"wb_update_dirty_ratelimit","policy_category":"Calculate_a_Value","value_type":"Time","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":"Stability","cost":null,"tradeoff_subcategory":"Performance vs. I/O or CPU overhead;  Performance vs. Memory use","feat_global_state":1,"feat_history":1,"feat_hardware":0,"feat_local_object":1,"feat_config":0,"code_block":"/*\n * Maintain wb->dirty_ratelimit, the base dirty throttle rate.\n *\n * Normal wb tasks will be curbed at or below it in long term.\n * Obviously it should be around (write_bw / N) when there are N dd tasks.\n */\nstatic void wb_update_dirty_ratelimit(struct dirty_throttle_control *dtc,\n                                      unsigned long dirtied,\n                                      unsigned long elapsed)\n{\n        struct bdi_writeback *wb = dtc->wb;\n        unsigned long dirty = dtc->dirty;\n        unsigned long freerun = dirty_freerun_ceiling(dtc->thresh, dtc->bg_thresh);\n        unsigned long limit = hard_dirty_limit(dtc_dom(dtc), dtc->thresh);\n        unsigned long setpoint = (freerun + limit) / 2;\n        unsigned long write_bw = wb->avg_write_bandwidth;\n        unsigned long dirty_ratelimit = wb->dirty_ratelimit;\n        unsigned long dirty_rate;\n        unsigned long task_ratelimit;\n        unsigned long balanced_dirty_ratelimit;\n        unsigned long step;\n        unsigned long x;\n        unsigned long shift;\n\n        /*\n         * The dirty rate will match the writeout rate in long term, except\n         * when dirty pages are truncated by userspace or re-dirtied by FS.\n         */\n        dirty_rate = (dirtied - wb->dirtied_stamp) * HZ / elapsed;\n\n        /*\n         * task_ratelimit reflects each dd's dirty rate for the past 200ms.\n         */\n        task_ratelimit = (u64)dirty_ratelimit *\n                                        dtc->pos_ratio >> RATELIMIT_CALC_SHIFT;\n        task_ratelimit++; /* it helps rampup dirty_ratelimit from tiny values */\n\n        /*\n         * A linear estimation of the \"balanced\" throttle rate. The theory is,\n         * if there are N dd tasks, each throttled at task_ratelimit, the wb's\n         * dirty_rate will be measured to be (N * task_ratelimit). So the below\n         * formula will yield the balanced rate limit (write_bw / N).\n         *\n         * Note that the expanded form is not a pure rate feedback:\n         *        rate_(i+1) = rate_(i) * (write_bw / dirty_rate)                     (1)\n         * but also takes pos_ratio into account:\n         *        rate_(i+1) = rate_(i) * (write_bw / dirty_rate) * pos_ratio  (2)\n         *\n         * (1) is not realistic because pos_ratio also takes part in balancing\n         * the dirty rate.  Consider the state\n         *        pos_ratio = 0.5                                                     (3)\n         *        rate = 2 * (write_bw / N)                                     (4)\n         * If (1) is used, it will stuck in that state! Because each dd will\n         * be throttled at\n         *        task_ratelimit = pos_ratio * rate = (write_bw / N)             (5)\n         * yielding\n         *        dirty_rate = N * task_ratelimit = write_bw                     (6)\n         * put (6) into (1) we get\n         *        rate_(i+1) = rate_(i)                                             (7)\n         *\n         * So we end up using (2) to always keep\n         *        rate_(i+1) ~= (write_bw / N)                                     (8)\n         * regardless of the value of pos_ratio. As long as (8) is satisfied,\n         * pos_ratio is able to drive itself to 1.0, which is not only where\n         * the dirty count meet the setpoint, but also where the slope of\n         * pos_ratio is most flat and hence task_ratelimit is least fluctuated.\n         */\n        balanced_dirty_ratelimit = div_u64((u64)task_ratelimit * write_bw,\n                                           dirty_rate | 1);\n        /*\n         * balanced_dirty_ratelimit ~= (write_bw / N) <= write_bw\n         */\n        if (unlikely(balanced_dirty_ratelimit > write_bw))\n                balanced_dirty_ratelimit = write_bw;\n\n        /*\n         * We could safely do this and return immediately:\n         *\n         *        wb->dirty_ratelimit = balanced_dirty_ratelimit;\n         *\n         * However to get a more stable dirty_ratelimit, the below elaborated\n         * code makes use of task_ratelimit to filter out singular points and\n         * limit the step size.\n         *\n         * The below code essentially only uses the relative value of\n         *\n         *        task_ratelimit - dirty_ratelimit\n         *        = (pos_ratio - 1) * dirty_ratelimit\n         *\n         * which reflects the direction and size of dirty position error.\n         */\n\n        /*\n         * dirty_ratelimit will follow balanced_dirty_ratelimit iff\n         * task_ratelimit is on the same side of dirty_ratelimit, too.\n         * For example, when\n         * - dirty_ratelimit > balanced_dirty_ratelimit\n         * - dirty_ratelimit > task_ratelimit (dirty pages are above setpoint)\n         * lowering dirty_ratelimit will help meet both the position and rate\n         * control targets. Otherwise, don't update dirty_ratelimit if it will\n         * only help meet the rate target. After all, what the users ultimately\n         * feel and care are stable dirty rate and small position error.\n         *\n         * |task_ratelimit - dirty_ratelimit| is used to limit the step size\n         * and filter out the singular points of balanced_dirty_ratelimit. Which\n         * keeps jumping around randomly and can even leap far away at times\n         * due to the small 200ms estimation period of dirty_rate (we want to\n         * keep that period small to reduce time lags).\n         */\n        step = 0;\n\n        /*\n         * For strictlimit case, calculations above were based on wb counters\n         * and limits (starting from pos_ratio = wb_position_ratio() and up to\n         * balanced_dirty_ratelimit = task_ratelimit * write_bw / dirty_rate).\n         * Hence, to calculate \"step\" properly, we have to use wb_dirty as\n         * \"dirty\" and wb_setpoint as \"setpoint\".\n         *\n         * We rampup dirty_ratelimit forcibly if wb_dirty is low because\n         * it's possible that wb_thresh is close to zero due to inactivity\n         * of backing device.\n         */\n        if (unlikely(wb->bdi->capabilities & BDI_CAP_STRICTLIMIT)) {\n                dirty = dtc->wb_dirty;\n                if (dtc->wb_dirty < 8)\n                        setpoint = dtc->wb_dirty + 1;\n                else\n                        setpoint = (dtc->wb_thresh + dtc->wb_bg_thresh) / 2;\n        }\n\n        if (dirty < setpoint) {\n                x = min3(wb->balanced_dirty_ratelimit,\n                         balanced_dirty_ratelimit, task_ratelimit);\n                if (dirty_ratelimit < x)\n                        step = x - dirty_ratelimit;\n        } else {\n                x = max3(wb->balanced_dirty_ratelimit,\n                         balanced_dirty_ratelimit, task_ratelimit);\n                if (dirty_ratelimit > x)\n                        step = dirty_ratelimit - x;\n        }\n\n        /*\n         * Don't pursue 100% rate matching. It's impossible since the balanced\n         * rate itself is constantly fluctuating. So decrease the track speed\n         * when it gets close to the target. Helps eliminate pointless tremors.\n         */\n        shift = dirty_ratelimit / (2 * step + 1);\n        if (shift < BITS_PER_LONG)\n                step = DIV_ROUND_UP(step >> shift, 8);\n        else\n                step = 0;\n\n        if (dirty_ratelimit < balanced_dirty_ratelimit)\n                dirty_ratelimit += step;\n        else\n                dirty_ratelimit -= step;\n\n        WRITE_ONCE(wb->dirty_ratelimit, max(dirty_ratelimit, 1UL));\n        wb->balanced_dirty_ratelimit = balanced_dirty_ratelimit;\n\n        trace_bdi_dirty_ratelimit(wb, dirty_rate, task_ratelimit);\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::page_writeback.c::node_dirty_ok","subsystem":"memory","file":"page-writeback.c","symbol":"node_dirty_ok","policy_category":"Detecting","value_type":"Attribute","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":null,"cost":null,"tradeoff_subcategory":null,"feat_global_state":1,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::memcontrol.c::memory.limit_in_bytes","subsystem":"memory","file":"memcontrol.c","symbol":"memory.limit_in_bytes","policy_category":"Threshold","value_type":"Threshold","how_coded":"External_Parameter","impl_taxonomy":"Configurations","benefit":"Isolation","cost":"Memory Availability","tradeoff_subcategory":"Stability vs. Memory availability","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory: e_scan_abort(int nid, struct collapse_control *cc)\n{\n        int i;\n\n        /*\n         * If node_reclaim_mode is disabled, then no extra effort is made to\n         * allocate memory locally.\n         */\n        if (!node_reclaim_enabled())\n                return false;\n\n        /* If there is a count for this node already, it must be acceptable */\n        if (cc->node_load[nid])\n                return false;\n\n        for (i = 0; i < MAX_NUMNODES; i++) {\n                if (!cc->node_load[i])\n                        continue;\n                if (node_distance(nid, i) > node_reclaim_distance)\n                        return true;\n        }\n        return false;\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::khugepaged.c::set_recommended_min_free_kbytes","subsystem":"memory","file":"khugepaged.c","symbol":"set_recommended_min_free_kbytes","policy_category":"Calculate_a_Value","value_type":"Space","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":"Memory Efficiency","cost":"Memory Availability","tradeoff_subcategory":null,"feat_global_state":1,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::hugetlb.c::_proc_sys_vm_nr_hugepages","subsystem":"memory","file":"hugetlb.c","symbol":"/proc/sys/vm/nr_hugepages","policy_category":"Size","value_type":"Space","how_coded":"External_Parameter","impl_taxonomy":"Configurations","benefit":"Performance (Latency/Throughput)","cost":"Memory Availability","tradeoff_subcategory":"Performance vs. Memory use","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::hugetlb.c::_proc_sys_vm_nr_overcommit_hugepages","subsystem":"memory","file":"hugetlb.c","symbol":"/proc/sys/vm/nr_overcommit_hugepages","policy_category":"Size","value_type":"Space","how_coded":"External_Parameter","impl_taxonomy":"Configurations","benefit":"Memory Availability","cost":"Stability, Predictivity","tradeoff_subcategory":"Space vs. Stability","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::huge_memory.c::_sys_kernel_mm_transparent_hugepage_enabled","subsystem":"memory","file":"huge_memory.c","symbol":"/sys/kernel/mm/transparent_hugepage/enabled","policy_category":"Action","value_type":"Mode","how_coded":"External_Parameter","impl_taxonomy":"Configurations","benefit":"Throughput","cost":"Latency, Memory Availability","tradeoff_subcategory":"Latency vs. Throughput","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::huge_memory.c::_sys_kernel_mm_transparent_hugepage_defrag","subsystem":"memory","file":"huge_memory.c","symbol":"/sys/kernel/mm/transparent_hugepage/defrag","policy_category":"Prioritization","value_type":"Mode","how_coded":"External_Parameter","impl_taxonomy":"Configurations","benefit":"Memory Efficiency","cost":"CPU Overhead","tradeoff_subcategory":"Space/Locality vs. I/O or CPU overhead","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::huge_memory.c::hugepage_vma_check","subsystem":"memory","file":"huge_memory.c","symbol":"hugepage_vma_check","policy_category":"Detecting","value_type":"Attribute","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":"Stability","cost":"Potential for Missed Optimizations","tradeoff_subcategory":"Stability vs. Correctness","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":1,"feat_config":0,"code_block":"bool hugepage_vma_check(struct vm_area_struct *vma, unsigned long vm_flags,\n                        bool smaps, bool in_pf, bool enforce_sysfs)\n{\n        if (!vma->vm_mm)                /* vdso */\n                return false;\n\n        /*\n         * Explicitly disabled through madvise or prctl, or some\n         * architectures may disable THP for some mappings, for\n         * example, s390 kvm.\n         * */\n        if ((vm_flags & VM_NOHUGEPAGE) ||\n            test_bit(MMF_DISABLE_THP, &vma->vm_mm->flags))\n                return false;\n        /*\n         * If the hardware/firmware marked hugepage support disabled.\n         */\n        if (transparent_hugepage_flags & (1 << TRANSPARENT_HUGEPAGE_UNSUPPORTED))\n                return false;\n\n        /* khugepaged doesn't collapse DAX vma, but page fault is fine. */\n        if (vma_is_dax(vma))\n                return in_pf;\n\n        /*\n         * Special VMA and hugetlb VMA.\n         * Must be checked after dax since some dax mappings may have\n         * VM_MIXEDMAP set.\n         */\n        if (vm_flags & VM_NO_KHUGEPAGED)\n                return false;\n\n        /*\n         * Check alignment for file vma and size for both file and anon vma.\n         *\n         * Skip the check for page fault. Huge fault does the check in fault\n         * handlers. And this check is not suitable for huge PUD fault.\n         */\n        if (!in_pf &&\n            !transhuge_vma_suitable(vma, (vma->vm_end - HPAGE_PMD_SIZE)))\n                return false;\n\n        /*\n         * Enabled via shmem mount options or sysfs settings.\n         * Must be done before hugepage flags check since shmem has its\n         * own flags.\n         */\n        if (!in_pf && shmem_file(vma->vm_file))\n                return shmem_is_huge(file_inode(vma->vm_file), vma->vm_pgoff,\n                                     !enforce_sysfs, vma->vm_mm, vm_flags);\n\n        /* Enforce sysfs THP requirements as necessary */\n        if (enforce_sysfs &&\n            (!hugepage_flags_enabled() || (!(vm_flags & VM_HUGEPAGE) &&\n                                           !hugepage_flags_always())))\n                return false;\n\n        /* Only regular file is valid */\n        if (!in_pf && file_thp_enabled(vma))\n                return true;\n\n        if (!vma_is_anonymous(vma))\n                return false;\n\n        if (vma_is_temporary_stack(vma))\n                return false;\n\n        /*\n         * THPeligible bit of smaps should show 1 for proper VMAs even\n         * though anon_vma is not initialized yet.\n         *\n         * Allow page fault since anon_vma may be not initialized until\n         * the first page fault.\n         */\n        if (!vma->anon_vma)\n                return (smaps || in_pf);\n\n        return true;\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::huge_memory.c::transhuge_vma_suitable","subsystem":"memory","file":"huge_memory.c","symbol":"transhuge_vma_suitable","policy_category":"Detecting","value_type":"Attribute","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":"Stability","cost":"Potential for Missed Optimizations","tradeoff_subcategory":"Stability vs. Correctness","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":1,"feat_config":0,"code_block":"static inline bool transhuge_vma_suitable(struct vm_area_struct *vma,\n                unsigned long addr)\n{\n        unsigned long haddr;\n\n        /* Don't have to check pgoff for anonymous vma */\n        if (!vma_is_anonymous(vma)) {\n                if (!IS_ALIGNED((vma->vm_start >> PAGE_SHIFT) - vma->vm_pgoff,\n                                HPAGE_PMD_NR))\n                        return false;\n        }\n\n        haddr = addr & HPAGE_PMD_MASK;\n\n        if (haddr < vma->vm_start || haddr + HPAGE_PMD_SIZE > vma->vm_end)\n                return false;\n        return true;\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::huge_memory.c::hugepage_init","subsystem":"memory","file":"huge_memory.c","symbol":"hugepage_init","policy_category":"Action","value_type":"Attribute","how_coded":"Inline_With_Mechanism","impl_taxonomy":"Inline_Code","benefit":"Stability","cost":"Potential for Missed Optimizations","tradeoff_subcategory":"Stability vs. Correctness","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"if (totalram_pages() < (512 << (20 - PAGE_SHIFT))) {\n                transparent_hugepage_flags = 0;\n                return 0;\n        }","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::huge_memory.c::can_split_folio","subsystem":"memory","file":"huge_memory.c","symbol":"can_split_folio","policy_category":"Action","value_type":"Attribute","how_coded":"Decision_Function","impl_taxonomy":"Decision_Function","benefit":"Performance (Latency/Throughput)","cost":"Heuristic Inaccuracy","tradeoff_subcategory":"Correctness vs. Latency","feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":1,"feat_config":0,"code_block":"/* Racy check whether the huge page can be split */\nbool can_split_folio(struct folio *folio, int *pextra_pins)\n{\n        int extra_pins;\n\n        /* Additional pins from page cache */\n        if (folio_test_anon(folio))\n                extra_pins = folio_test_swapcache(folio) ?\n                                folio_nr_pages(folio) : 0;\n        else\n                extra_pins = folio_nr_pages(folio);\n        if (pextra_pins)\n                *pextra_pins = extra_pins;\n        return folio_mapcount(folio) == folio_ref_count(folio) - extra_pins - 1;\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memor ion.c","symbol":"too_many_isolated","policy_category":"Action","value_type":"Attribute","how_coded":"Decision_Function","impl_taxonomy":"Decision_Function","benefit":"Memory Overhead","cost":"Throughput","tradeoff_subcategory":"Performance vs. I/O or CPU overhead","feat_global_state":1,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":0,"code_block":"/* Similar to reclaim, but different enough that they don't share logic */\nstatic bool too_many_isolated(struct compact_control *cc)\n{\n        pg_data_t *pgdat = cc->zone->zone_pgdat;\n        bool too_many;\n\n        unsigned long active, inactive, isolated;\n\n        inactive = node_page_state(pgdat, NR_INACTIVE_FILE) +\n                        node_page_state(pgdat, NR_INACTIVE_ANON);\n        active = node_page_state(pgdat, NR_ACTIVE_FILE) +\n                        node_page_state(pgdat, NR_ACTIVE_ANON);\n        isolated = node_page_state(pgdat, NR_ISOLATED_FILE) +\n                        node_page_state(pgdat, NR_ISOLATED_ANON);\n\n        /*\n         * Allow GFP_NOFS to isolate past the limit set for regular\n         * compaction runs. This prevents an ABBA deadlock when other\n         * compactors have already isolated to the limit, but are\n         * blocked on filesystem locks held by the GFP_NOFS thread.\n         */\n        if (cc->gfp_mask & __GFP_FS) {\n                inactive >>= 3;\n                active >>= 3;\n        }\n\n        too_many = isolated > (inactive + active) / 2;\n        if (!too_many)\n                wake_throttle_isolated(pgdat);\n\n        return too_many;\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::compaction.c::freelist_scan_limit","subsystem":"memory","file":"compaction.c","symbol":"freelist_scan_limit","policy_category":"Calculate_a_Value","value_type":"Space","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":"reduce CPU Overhead","cost":"Throughput","tradeoff_subcategory":"Performance vs. I/O or CPU overhead","feat_global_state":1,"feat_history":0,"feat_hardware":0,"feat_local_object":1,"feat_config":0,"code_block":null,"area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::compaction.c::suitable_migration_source","subsystem":"memory","file":"compaction.c","symbol":"suitable_migration_source","policy_category":"Detecting","value_type":"Attribute","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":null,"cost":null,"tradeoff_subcategory":null,"feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":1,"code_block":"static bool suitable_migration_source(struct compact_control *cc,\n                                                        struct page *page)\n{\n        int block_mt;\n\n        if (pageblock_skip_persistent(page))\n                return false;\n\n        if ((cc->mode != MIGRATE_ASYNC) || !cc->direct_compaction)\n                return true;\n\n        block_mt = get_pageblock_migratetype(page);\n\n        if (cc->migratetype == MIGRATE_MOVABLE)\n                return is_migrate_movable(block_mt);\n        else\n                return block_mt == cc->migratetype;\n}","area":null,"default_value":null,"options":null,"modification_layers":null},{"id":"memory::compaction.c::suitable_migration_target","subsystem":"memory","file":"compaction.c","symbol":"suitable_migration_target","policy_category":"Detecting","value_type":"Attribute","how_coded":"Low_Level_Supporting_Function","impl_taxonomy":"Decision_Function","benefit":null,"cost":null,"tradeoff_subcategory":null,"feat_global_state":0,"feat_history":0,"feat_hardware":0,"feat_local_object":0,"feat_config":1,"code_block":"static bool suitable_migration_target(struct compact_control *cc,\n                                                        struct page *page)\n{\n        /* If the page is a large free page, then disallow migration */\n        if (
