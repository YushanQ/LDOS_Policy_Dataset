function showTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.textContent.toLowerCase().includes(name==='overview'?'overview':'query')));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
}

// ── overview ──────────────────────────────────────────────────────────────────
function buildOverview(){
  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="mlabel">Total policies</div><div class="mval">${STATS.total}</div></div>
    <div class="metric"><div class="mlabel">Subsystems</div><div class="mval">${Object.keys(STATS.by_subsystem).length}</div></div>
    <div class="metric"><div class="mlabel">Categories</div><div class="mval">${Object.keys(STATS.by_category).length}</div></div>
    <div class="metric"><div class="mlabel">Impl types</div><div class="mval">${Object.keys(STATS.by_impl).length}</div></div>
  `;
  bars('c-sub',  STATS.by_subsystem, SUB_COLORS);
  bars('c-cat',  STATS.by_category,  null, CAT_COLOR);
  bars('c-impl', STATS.by_impl,      null, IMPL_COLOR);
  bars('c-area', STATS.by_area,      null, '#7C3AED');
}

function bars(id, data, colorMap, def){
  const el=document.getElementById(id);
  if(!el)return;
  const sorted=Object.entries(data).filter(([k])=>k&&k!=='null').sort((a,b)=>b[1]-a[1]);
  const max=Math.max(...sorted.map(([,v])=>v));
  el.innerHTML=sorted.map(([k,v])=>{
    const color=colorMap?(colorMap[k]||def||IMPL_COLOR):(def||IMPL_COLOR);
    return `<div class="bar-row">
      <span class="blabel" title="${k}">${k.replace(/_/g,' ')}</span>
      <div class="btrack"><div class="bfill" style="width:${Math.round(v/max*100)}%;background:${color}"></div></div>
      <span class="bcount">${v}</span>
    </div>`;
  }).join('');
}

// ── filters ───────────────────────────────────────────────────────────────────
function buildFilters(){
  const layerSet=new Set();
  RECORDS.forEach(r=>{(r.modification_layers||'').split('; ').forEach(l=>{if(l.trim())layerSet.add(l.trim());});});
  [['f-sub','subsystem'],['f-cat','policy_category'],['f-impl','impl_taxonomy'],['f-vtype','value_type']].forEach(([id,key])=>{
    const sel=document.getElementById(id);
    (VOCAB[key]||[]).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v.replace(/_/g,' ');sel.appendChild(o);});
  });
  const modSel=document.getElementById('f-mod');
  [...layerSet].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v.replace(/_/g,' ');modSel.appendChild(o);});
  buildBenefitOptions('');
}

function applyFilters(){
  const q    =document.getElementById('f-search').value.toLowerCase();
  const sub  =document.getElementById('f-sub').value;
  const cat  =document.getElementById('f-cat').value;
  const impl =document.getElementById('f-impl').value;
  const mod   =document.getElementById('f-mod').value;
  const vtype =document.getElementById('f-vtype').value;
  const feat  =document.getElementById('f-feat').value;
  const selB =[...selectedBenefitSet];
  filtered=RECORDS.filter(r=>{
    if(sub  && r.subsystem!==sub) return false;
    if(cat  && r.policy_category!==cat) return false;
    if(impl && r.impl_taxonomy!==impl) return false;
    if(mod   && !(r.modification_layers||'').includes(mod)) return false;
    if(vtype && r.value_type!==vtype) return false;
    if(feat  && !r[feat]) return false;
    if(selB.length>0 && !selB.includes(r.benefit||'')) return false;
    if(q){const h=[r.file,r.symbol,r.benefit,r.cost,r.area,r.code_block].filter(Boolean).join(' ').toLowerCase();if(!h.includes(q))return false;}
    return true;
  });
  document.getElementById('result-count').textContent=filtered.length+' of '+RECORDS.length+' policies';
  renderTable();
}

// ── table ─────────────────────────────────────────────────────────────────────
function renderTable(){
  const tbody=document.getElementById('tbody');
  if(!filtered.length){tbody.innerHTML=`<tr><td colspan="7"><div class="empty">No policies match.</div></td></tr>`;return;}
  tbody.innerHTML=filtered.map(r=>{
    const fileOrArea=r.area?r.area.replace(/_/g,' '):(r.file||'—');
    const benefit=r.benefit?(r.benefit.length>45?r.benefit.slice(0,45)+'…':r.benefit):'—';
    const cost=r.cost?(r.cost.length>30?r.cost.slice(0,30)+'…':r.cost):'—';
    return `<tr class="${selId===r.id?'sel':''}" data-id="${r.id.replace(/"/g,'&quot;')}">
      <td title="${r.area||r.file||''}">${fileOrArea}</td>
      <td title="${r.symbol}">${r.symbol}</td>
      <td><span class="cb cb-${r.subsystem}">${r.subsystem.replace(/_/g,' ')}</span></td>
      <td>${r.policy_category||'—'}</td>
      <td>${r.impl_taxonomy||'—'}</td>
      <td title="${r.benefit||''}">${benefit}</td>
      <td title="${r.cost||''}">${cost}</td>
    </tr>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('tbody').addEventListener('click',e=>{
    const tr=e.target.closest('tr');
    if(tr&&tr.dataset.id) openDetail(tr.dataset.id);
  });
});
// Also attach after render since tbody is replaced
function attachTbodyClick(){
  document.getElementById('tbody').addEventListener('click',e=>{
    const tr=e.target.closest('tr');
    if(tr&&tr.dataset.id) openDetail(tr.dataset.id);
  });
}

// ── detail ────────────────────────────────────────────────────────────────────
function openDetail(id){
  selId=id;
  document.querySelectorAll('tbody tr').forEach(tr=>tr.classList.toggle('sel',tr.dataset.id===id));
  const r=RECORDS.find(x=>x.id===id);
  if(!r)return;
  document.getElementById('detail-col').classList.add('open');
  document.getElementById('dtitle').textContent=r.symbol||r.id;
  const isFsn=r.subsystem==='filesystem';
  const feats=[['Global state',r.feat_global_state],['History',r.feat_history],['Hardware',r.feat_hardware],['Local object',r.feat_local_object],['Config',r.feat_config]];

  function frow(label,val){
    if(val===null||val===undefined||val==='') return '';
    return `<div class="frow"><span class="fl">${label}</span><span class="fv">${val}</span></div>`;
  }

  document.getElementById('dbody').innerHTML=`
    <div class="dsec">
      <div class="dsec-title">Identity</div>
      ${frow('Subsystem',`<span class="cb cb-${r.subsystem}">${r.subsystem.replace(/_/g,' ')}</span>`)}
      ${r.area ? frow('Area',r.area.replace(/_/g,' ')) : frow('File',r.file)}
      ${frow('Symbol',r.symbol)}
    </div>
    <div class="dsec">
      <div class="dsec-title">Classification</div>
      ${frow('Category',r.policy_category)}
      ${frow('Value type',r.value_type)}
      ${frow('Implementation',r.impl_taxonomy)}
    </div>
    ${isFsn&&(r.default_value||r.options||r.modification_layers)?`
    <div class="dsec">
      <div class="dsec-title">Filesystem</div>
      ${frow('Default',r.default_value?`<code>${r.default_value}</code>`:null)}
      ${frow('Options',r.options?`<code>${r.options}</code>`:null)}
      ${frow('Mod layers',r.modification_layers?r.modification_layers.replace(/; /g,' · '):null)}
    </div>`:''}
    ${(r.benefit||r.cost)?`
    <div class="dsec">
      <div class="dsec-title">Tradeoffs</div>
      ${frow('Benefit',r.benefit)}
      ${frow('Cost',r.cost)}
    </div>`:''}
    <div class="dsec">
      <div class="dsec-title">Features</div>
      <div class="feat-grid">
        ${feats.map(([l,v])=>`<span class="feat ${v?'on':'off'}">${l}</span>`).join('')}
      </div>
    </div>
    ${r.code_block?`
    <div class="dsec">
      <div class="dsec-title">${isFsn?'Notes':'Code'}</div>
      <div class="code-block">${r.code_block.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
    </div>`:''}
  `;
}

function closeDetail(){
  document.getElementById('detail-col').classList.remove('open');
  selId=null;
  document.querySelectorAll('tbody tr').forEach(tr=>tr.classList.remove('sel'));
}

// ── benefit dropdown ──────────────────────────────────────────────────────────
function buildBenefitOptions(query){
  const container=document.getElementById('benefit-options');
  if(!container)return;
  const q=query.toLowerCase();
  const items=(VOCAB['benefit']||[]).filter(v=>!q||v.toLowerCase().includes(q));
  container.innerHTML=items.map(v=>{
    const checked=selectedBenefitSet.has(v);
    const safe=v.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `<div class="bd-item ${checked?'checked':''}" data-val="${safe}">
      <span class="bd-cb"><span class="bd-cb-tick">✓</span></span>
      <span>${safe}</span>
    </div>`;
  }).join('');
  container.querySelectorAll('.bd-item').forEach(el=>{
    el.addEventListener('click',()=>toggleBenefit(el.dataset.val));
  });
}
function toggleBenefit(val){
  if(selectedBenefitSet.has(val))selectedBenefitSet.delete(val);
  else selectedBenefitSet.add(val);
  buildBenefitOptions(document.getElementById('benefit-search')?.value||'');
  updateBenefitLabel();
  applyFilters();
}
function updateBenefitLabel(){
  const n=selectedBenefitSet.size;
  const first=[...selectedBenefitSet][0]||'';
  document.getElementById('benefit-label').textContent=n===0?'All benefits':n===1?(first.length>28?first.slice(0,28)+'…':first):n+' selected';
}
function clearBenefits(){
  selectedBenefitSet.clear();
  buildBenefitOptions(document.getElementById('benefit-search')?.value||'');
  updateBenefitLabel();
  applyFilters();
}
function toggleBenefitMenu(){
  const menu=document.getElementById('benefit-menu');
  const btn=document.getElementById('benefit-btn');
  const isOpen=menu.classList.contains('open');
  if(isOpen){closeBenefitMenu();}
  else{menu.classList.add('open');btn.classList.add('open');document.getElementById('benefit-search')?.focus();}
}
function closeBenefitMenu(){
  document.getElementById('benefit-menu')?.classList.remove('open');
  document.getElementById('benefit-btn')?.classList.remove('open');
}
function filterBenefitMenu(){
  buildBenefitOptions(document.getElementById('benefit-search').value);
}

// ── export ────────────────────────────────────────────────────────────────────
function exportCSV(){
  const cols=['id','subsystem','file','symbol','area','policy_category','value_type','impl_taxonomy',
              'benefit','cost','tradeoff_subcategory','feat_global_state','feat_history','feat_hardware',
              'feat_local_object','feat_config','code_block','default_value','options','modification_layers'];
  const csv=[cols.join(','),...filtered.map(r=>cols.map(k=>{
    const v=r[k]==null?'':String(r[k]);
    return(v.includes(',')||v.includes('"')||v.includes('\n'))?`"${v.replace(/"/g,'""')}"`:v;
  }).join(','))].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='ldos_policies.csv';a.click();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});

// attach tbody click (works after initial render too)
(function waitTbody(){
  const tb=document.getElementById('tbody');
  if(tb){tb.addEventListener('click',e=>{const tr=e.target.closest('tr');if(tr&&tr.dataset.id)openDetail(tr.dataset.id);});}
  else setTimeout(waitTbody,50);
})();
</script>
